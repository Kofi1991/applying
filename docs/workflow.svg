<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>ZapApply workflow</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="470" fill="#ffffff"/>
  <g font-size="14" text-anchor="middle">
    <g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
      <rect x="50" y="40" width="170" height="56" rx="8"/><rect x="260" y="40" width="170" height="56" rx="8"/><rect x="50" y="240" width="170" height="56" rx="8"/>
    </g>
    <g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
      <rect x="470" y="40" width="170" height="56" rx="8"/><rect x="470" y="140" width="170" height="56" rx="8"/><rect x="260" y="140" width="170" height="56" rx="8"/>
      <rect x="50" y="140" width="170" height="56" rx="8"/><rect x="260" y="240" width="170" height="56" rx="8"/><rect x="470" y="340" width="170" height="56" rx="8"/>
    </g>
    <rect x="470" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <g font-weight="600" fill="#085041"><text x="135" y="63">Sign up</text><text x="345" y="63">Profile and CV</text><text x="135" y="263">You approve</text></g>
    <g font-size="12" fill="#0F6E56"><text x="135" y="83">Email login</text><text x="345" y="83">CV, pay, office days</text><text x="135" y="283">Pick roles, confirm</text></g>
    <g font-weight="600" fill="#3C3489"><text x="555" y="63">Scheduler</text><text x="555" y="163">Search agent</text><text x="345" y="163">Reviewer</text><text x="135" y="163">Shortlist</text><text x="345" y="263">mrApply</text><text x="555" y="363">Tracker</text></g>
    <g font-size="12" fill="#534AB7"><text x="555" y="83">Daily at your time</text><text x="555" y="183">Finds matching roles</text><text x="345" y="183">Scores against CV</text><text x="135" y="183">PDF and email alert</text><text x="345" y="283">Fills forms, uploads CV</text><text x="555" y="383">Logs, skips repeats</text></g>
    <text x="555" y="263" font-weight="600" fill="#444441">Application sent</text><text x="555" y="283" font-size="12" fill="#5F5E5A">Confirmation saved</text>
  </g>
  <g stroke="#73726c" stroke-width="1.5" marker-end="url(#a)">
    <line x1="222" y1="68" x2="256" y2="68"/><line x1="432" y1="68" x2="466" y2="68"/><line x1="555" y1="98" x2="555" y2="136"/>
    <line x1="468" y1="168" x2="434" y2="168"/><line x1="258" y1="168" x2="224" y2="168"/><line x1="135" y1="198" x2="135" y2="236"/>
    <line x1="222" y1="268" x2="256" y2="268"/><line x1="432" y1="268" x2="466" y2="268"/><line x1="555" y1="298" x2="555" y2="336"/>
  </g>
  <text x="455" y="372" font-size="12" fill="#5F5E5A" text-anchor="end">↻ feeds the next run</text>
  <rect x="50" y="424" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="70" y="434" font-size="12" fill="#444441">User steps</text>
  <rect x="160" y="424" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="180" y="434" font-size="12" fill="#444441">ZapApply agents in the cloud</text>
  <text x="380" y="434" font-size="12" fill="#888780">v1 covers everything except mrApply and in-app approval</text>
</svg>
